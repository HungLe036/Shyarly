# External data sources. Only URLs/IDs live here; code reads them via shyarly.config.

oracles_elixir:
  # source: https://oracleselixir.com/tools/downloads -> "Access files via Google Drive"
  # Drive folder: https://drive.google.com/drive/folders/1gLSw0RLjBbtaNy0dgnGQDAZOHIgCe-HH
  # Old S3 bucket (oracleselixir-downloadable-match-data) returns 404 as of 2026-10-18.
  download_url: "https://drive.usercontent.google.com/download?id={file_id}&export=download&confirm=t"
  filename: "{year}_LoL_esports_match_data_from_OraclesElixir.csv"
  # OE updates files once per day; only the current year needs refreshing.
  refresh_years: [2026]
  file_ids:
    2022: "1EHmptHyzY8owv0BAcNKtkQpMwfkURwRy"
    2023: "1XXk2LO0CsNADBB1LRGOV5rUpyZdEZ8s2"
    2024: "1IjIEhLc9n8eLKeY-yh_YigKVWbhgGBsN"
    2025: "1v6LRphp2kYciU4SXp0PCjEMuev1bDejc"
    2026: "1hnpbrUpBMS1TZI7IovfpKeZfWJH1Aptm"

leaguepedia:
  # source: https://lol.fandom.com/api.php (Cargo). Anonymous access is rate-limited.
  api_url: "https://lol.fandom.com/api.php"
  min_interval_s: 2.0
  max_retries: 5
  backoff_s: 30.0
  user_agent: "Shyarly/0.1 (personal research project; cached, throttled)"

oddspapi:
  # source: https://oddspapi.io/us/docs (v4) and .../requests-and-quota (read 2026-10-19).
  # Key: ODDSPAPI_KEY in the environment or in .env at the repo root (gitignored). Never committed.
  # Free plan: 250 billable requests per month. /v4/historical-odds and /v4/account are free.
  base_url: "https://api.oddspapi.io/v4"
  sport_id: 18                      # ESport League of Legends
  bookmakers: [pinnacle]            # sharp benchmark; up to 3 per call
  # LoL market ids from GET /v4/markets?sportId=18 (2026-10-19; the CS2 guide's 171 does not apply):
  match_winner_market: 181          # "Winner" (series); outcomes 181 = participant 1, 182 = participant 2
  first_map_market: 1847            # "First Map Winner"; outcomes 1847 / 1848 -> comparable with p_game
  monthly_budget: 200               # hard stop for billable calls, leaving 50 spare
  min_interval_s: 5.0               # 1s triggered 429s on /historical-odds; 5s did not (2026-10-19)
  # /historical-odds is free but rate-limited (HTTP 429): wait and retry; one bookmaker per call
  # (several at once returned "Invalid bookmaker/outcome combination").
  rate_limit_wait_s: 15
  rate_limit_retries: 4
  # Tournaments followed during Worlds (GET /v4/tournaments?sportId=18): 2549 World Championship,
  # 2527 Mid-Season Invitational, 45617 First Stand.
  worlds_tournament_id: 2549
  # OddsPapi name -> Oracle's Elixir name, where case/punctuation-insensitive matching fails.
  # Each was checked by the series join (same opponent and start time) on 2026-10-19.
  team_aliases:
    "Furia Esports": "FURIA"
    "Lyon Gaming": "LYON"

oddsportal:
  # User-supplied scrape of OddsPortal (2026-10-20), kept local in data/raw/oddsportal/ (gitignored;
  # OddsPortal's terms restrict scraping and redistribution). Average closing odds over the listed
  # bookmakers (median 6, mostly soft/crypto books, no Pinnacle). See src/shyarly/data/oddsportal.py.
  file_sha256: "c6e9320ec40098eeae1a789c7752f95c51aa54d16ce5fb41672946b03b6cdac0"
  international: ["World Championship", "Mid-Season Invitational", "Esports World Cup"]
  # OddsPortal name -> Oracle's Elixir name. Derived 2026-10-20 from the data itself: for rows where
  # one side maps, the OE series that day with the mapped opponent names the other side. Votes shown.
  team_aliases:
    "FURIA Esports": "FURIA"                     # 3/3
    "FearX": "BNK FEARX"                         # 91/91 (2024-26)
    "FlyQuest eSports": "FlyQuest"               # 89/93
    "Hanwha Life": "Hanwha Life Esports"         # 176/176
    "Heretics": "Team Heretics"                  # 40/44
    "KRX": "Kiwoom DRX"                          # 146/147
    "LOS": "LØS"                                 # 5/5
    "Lyon Gaming": "LYON"                        # 33/33
    "Misfits": "Misfits Gaming"                  # 14/17
    "NRG Esports": "NRG"                         # 31/32
    "Secret Whales": "Team Secret Whales"        # 2/2
    "TT Gaming": "ThunderTalk Gaming"            # 132/133
    "Talon": "PSG Talon"                         # 12/12
    "Team SoloMid": "TSM"                        # 16/17
    "Vitality": "Team Vitality"                  # 67/70
    "Vivo Keyd": "Vivo Keyd Stars"               # 4/4
  # OddsPortal shows today's name on old matches; tried after the current name, for that season only.
  past_names:
    "FearX": {2022: "Liiv SANDBOX", 2023: "Liiv SANDBOX"}                                   # 58/58
    "Shifters": {2022: "Team BDS", 2023: "Team BDS", 2024: "Team BDS", 2025: "Team BDS"}    # 59/66
    "Movistar KOI": {2022: "MAD Lions KOI", 2023: "MAD Lions KOI", 2024: "MAD Lions KOI"}   # 35/38

rules:
