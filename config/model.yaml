# Model and backtest settings. Modelling choices, not tournament facts.

seed: 20261018

backtest:
  # Spec (docs/02-refined-plan.md "Splits")
  tune_events: ["WLDs 2022", "MSI 2023", "WLDs 2023"]
  holdout_events: ["MSI 2024", "WLDs 2024", "MSI 2025", "WLDs 2025", "MSI 2026"]
  modes: [live, pre_event]       # live = refit before each UTC match day; pre_event = freeze at event start
  tune_mode: pre_event           # cheap: one fit per event per config
  bootstrap_resamples: 2000      # spec "Promotion gates"
  bootstrap_unit: series_id      # games in a series are correlated, so resample whole series
  ece_bins: 5
  # Every time holdout results were viewed during development. Shown in reports/backtest.md:
  # the chosen setup was picked after these looks, so holdout scores are optimistically biased.
  holdout_looks:
    - "M2 (38a6cba): one shared half-life. BT 0.6251 vs region prior 0.6237 (holdout live log loss)."
    - "e2fbbcb: separate cross-region half-life. BT 0.6189 vs region prior 0.6237."
    - "Widened grids (lambda_team to 64, half-lives 30–1460 days, 4-year lookback), discarded: BT 0.6238 vs region prior 0.6252. The e2fbbcb setup was kept after seeing this."

production:
  # The model used by `shyarly predict` and `shyarly simulate`. Copied from reports/backtest.md
  # (commit 4678d8d) so predictions don't depend on re-running the backtest.
  model: bt
  bt_params:
    half_life_days: 60
    half_life_intl_days: 730
    intl_weight: 1.0
    lambda_region_major: 0.1
    lambda_region_minor: 2.0
    lambda_team: 16.0
  temperature: 1.0502     # fitted on BT live predictions for all 8 backtest events

simulation:
  runs: 50000             # spec: stable within ±0.5pp across seeds at 50k runs
  # Each run draws team strengths from the BT Laplace posterior (one draw per run, so the
  # Monte Carlo margin is unchanged). Without it, tournament odds treat strengths as known.
  posterior: true

gates:
  # Spec "Promotion gates": holdout, live mode, calibrated BT, paired bootstrap.
  coinflip_log_loss: 0.693           # BT log loss must be below this
  # BT must beat the region prior: point Δ below -min_gain and 95% CI excluding 0. Δ is reported.
  # Was 0.010 in the spec; revised to 0.0 on 2026-10-18 (see gate_changes).
  min_gain_vs_region_prior: 0.0
  max_ci80_upper_vs_elo: 0.005       # point gain > 0 and 80% CI upper bound <= this
  max_ece: 0.05
  slope_range: [0.8, 1.2]

# Changes to the gates after results were seen. Shown in reports/backtest.md.
gate_changes:
  - "2026-10-18: 'Beats region prior' revised from 'Δ ≤ −0.010 with 95% CI excluding 0' to 'Δ < 0 with 95% CI excluding 0, Δ reported'. Decided by the user after three holdout looks (see holdout_looks), on a review finding that team-level information adds about 0.005 log loss at best at international events, including on 308 non-holdout cross-region games."

# Variants run next to production, predictions logged but not used for the odds. Each entry is
# written down BEFORE its results are seen; the decision follows `promote_if` and nothing else.
shadow_models:
  margin_bt:
    registered: "2026-10-19, before any Worlds 2026 Swiss game was played"
    idea: >-
      BT plus a Gaussian term on the gold difference at 15 minutes (blue minus red), for games where
      Oracle's Elixir has it. Games without it (all LPL games in 2022-2025, about 20% of LPL 2026,
      MSI 2024) contribute only their win/loss term, so missing data makes estimates less precise
      but not biased. Loss = BT loss + margin_weight * sum_i w_i (gd15_i / c - z_i)^2 / (2 sigma^2),
      where z_i is the same BT logit as in the win term (side term included) and w_i the same
      time-decay weight. Implemented in models/bt.py (BTParams.margin_weight > 0).
    scale: >-
      c (gold per logit unit) and sigma (residual sd in logit units) are fitted once, by regressing
      gd15 on the production BT logit, on games dated before 2022-09-29 (start of Worlds 2022, the
      first tune event), and then frozen.
    grid:
      margin_weight: [0.5, 1.0]      # every other parameter = production.bt_params
    temperature: "fitted like production: rolling, then on all eight backtest events"
    select: "margin_weight with the lower calibrated pre_event log loss on the tune events"
    promote_if:
      - "Δ log loss vs production < 0 on the tune events (pre_event mode, calibrated)"
      - "Δ game log loss vs production < 0 on Worlds 2026 Swiss games (live mode, predictions_log.csv)"
    report_only: "holdout events (this run is recorded as holdout look 4)"
    decision_date: "2026-11-01, after Swiss Round 5"

bt:
  lookback_days: 730             # older games carry < 6% weight even at the longest half-life
  # Regions whose prior is wider (smaller ridge penalty): few international games, can sit far from average.
  minor_regions: [LCP, CBLOL, VCS, LLA, LJL, LCO, TCL]
  grid:
    half_life_days: [60, 120, 180]        # domestic games; spec: "tune 60–180 days"
    # Cross-region games (the only ones that move region offsets) get their own, longer memory.
    # Added after M2: one shared half-life forced a trade-off between team form and region strength.
    half_life_intl_days: [180, 365, 730]
    lambda_team: [2.0, 4.0, 8.0, 16.0]
    lambda_region_major: [0.1]            # chosen in every M2 tuning run
    lambda_region_minor: [0.1, 2.0]
    intl_weight: [1.0, 2.0]

region_prior:
  lookback_days: 730
  minor_regions: [LCP, CBLOL, VCS, LLA, LJL, LCO, TCL]
  grid:
    half_life_days: [60, 90, 120, 180, 365, 730]
    lambda_region_major: [0.03, 0.1, 0.5, 2.0]
    lambda_region_minor: [0.01, 0.1, 0.5, 2.0]
    intl_weight: [1.0]           # only cross-region games inform region offsets anyway

elo:
  grid:
    # Cross-region games are rare, so region offsets need a large K to move at all.
    k_team: [4, 8, 16, 24, 32]
    k_region: [8, 16, 32, 64, 128, 256]
    season_carry: [0.25, 0.5, 0.75, 1.0]   # team rating multiplier per calendar-year boundary
