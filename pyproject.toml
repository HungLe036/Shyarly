[project]
name = "shyarly"
version = "0.1.0"
description = "Calibrated win probabilities and Monte Carlo simulation for the League of Legends World Championship 2026."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.1",
    "pandas>=2.2",
    "pyarrow>=17",
    "scipy>=1.14",
    "pyyaml>=6.0",
    "requests>=2.32",
    "typer>=0.12",
]

[project.scripts]
shyarly = "shyarly.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pypdf>=5.0",
]
app = [
    "streamlit>=1.50",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shyarly"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m 'not slow'"
markers = ["slow: long-running checks (run with `pytest -m slow`)"]
